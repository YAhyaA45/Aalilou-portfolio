<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>aalilou | تصميم شعارات</title>
<meta name="description" content="aalilou: معرض شعارات احترافية. تواصل معي لتصميم شعار علامتك.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2248%22 fill=%22%230b1220%22/><text x=%2252%22 y=%2272%22 font-size=%2260%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22serif%22>A</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<script>
/* الوضع الليلي: يتذكر اختيارك، وإلا يتبع إعدادات جهازك */
(function(){var t;try{t=localStorage.getItem("theme")}catch(e){}
if(!t)t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
document.documentElement.dataset.theme=t})();
</script>
<style>
/* ===== الألوان: ذهبي + فضي. غيّرها من هنا ===== */
:root{
  --gold:#d4a73a; --gold2:#f6e3a1; --gold3:#a67c1d;
  --silver:#c9ced6; --silver2:#f3f5f8; --silver3:#8b93a1;
  --black:#050506; --charcoal:#1c1d22;
  --metal:linear-gradient(135deg,var(--gold),var(--gold2) 45%,var(--silver) 100%);
  /* الوضع النهاري */
  --ivory:#f3f4f7; --ink:#14151a; --muted:#666b78; --title:#14151a;
  --cardbg:linear-gradient(135deg,#eceef3,#cdd1da); --foot:#ffffff; --shadow:#00000022;
}
/* الوضع الليلي */
html[data-theme="dark"]{
  --ivory:#0a0a0d; --ink:#ececf0; --muted:#9a9eab; --title:#f5f5f8;
  --cardbg:linear-gradient(135deg,#34363d,#17181c); --foot:#050507; --shadow:#000000b0;
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:'Cairo',system-ui,sans-serif;background:var(--ivory);color:var(--ink);overflow-x:hidden;transition:background .4s,color .4s}
a{color:inherit}

/* شريط علوي */
nav{position:fixed;top:0;inset-inline:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:.8rem 1.4rem;
  background:#0a0a0dcc;backdrop-filter:blur(10px);color:#fff;border-bottom:1px solid #d4a73a33}
nav .lg{display:flex;align-items:center;gap:.6rem;font-family:'Cormorant Garamond',serif;font-weight:700;font-size:1.6rem;direction:ltr;text-decoration:none}
nav .lg svg,nav .lg img{width:34px;height:34px;object-fit:contain;border-radius:50%;display:block}
.acts{display:flex;align-items:center;gap:.7rem}
nav .cta{background:var(--metal);color:var(--black);padding:.45rem 1.2rem;border-radius:99px;font-weight:700;text-decoration:none;font-size:.95rem;transition:transform .2s}
nav .cta:hover{transform:scale(1.06)}
.tg{width:38px;height:38px;border-radius:50%;border:1.5px solid #c9ced688;background:transparent;color:var(--gold2);cursor:pointer;display:grid;place-items:center;transition:transform .3s,background .3s}
.tg:hover{background:#ffffff1f;transform:rotate(20deg) scale(1.08)}
.tg svg{width:20px;height:20px}
html[data-theme="dark"] .moon{display:none}
html:not([data-theme="dark"]) .sun{display:none}

/* الواجهة */
.hero{position:relative;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:6rem 1.5rem 4rem;color:#fff;overflow:hidden;
  background:linear-gradient(135deg,#050506,var(--charcoal),#0b0b0e,#2a2b31);background-size:300% 300%;animation:bg 14s ease infinite}
@keyframes bg{50%{background-position:100% 100%}}
.orb{position:absolute;border-radius:50%;filter:blur(80px);pointer-events:none;animation:drift 16s ease-in-out infinite alternate}
.o1{width:38vmax;height:38vmax;background:var(--silver);opacity:.22;top:-12vmax;left:-10vmax}
.o2{width:30vmax;height:30vmax;background:var(--gold);opacity:.3;bottom:-10vmax;right:-8vmax;animation-duration:21s}
.o3{width:16vmax;height:16vmax;background:var(--gold2);opacity:.14;top:42%;left:58%;animation-duration:25s}
@keyframes drift{to{transform:translate(7vmax,5vmax) scale(1.2)}}
.hero>*{position:relative}

.mark{width:clamp(110px,22vw,170px);margin-bottom:1rem;filter:drop-shadow(0 10px 40px #d4a73a99);animation:pop .7s cubic-bezier(.2,1.3,.3,1) both,float 6s 1s ease-in-out infinite}
.mark svg,.mark img{width:100%;height:auto;display:block}
@keyframes pop{from{opacity:0;transform:scale(.3) rotate(-30deg)}}
@keyframes float{50%{transform:translateY(-10px)}}
.slash{stroke-dasharray:200;stroke-dashoffset:200;animation:draw .9s .3s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}

/* الاسم: تدرّج ذهبي وفضي */
.brand{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:clamp(3.4rem,15vw,9rem);line-height:1.15;direction:ltr;padding:0 .1em;
  background:linear-gradient(100deg,var(--silver) 0%,#fff 14%,var(--gold2) 30%,var(--gold) 45%,var(--silver) 62%,#fff 78%,var(--gold2) 90%,var(--silver) 100%);background-size:250% 100%;
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
  animation:brandIn 1.3s .15s cubic-bezier(.2,.8,.2,1) both,shine 6s linear infinite}
@keyframes brandIn{from{clip-path:inset(-20% 100% -20% -10%);opacity:0;filter:blur(10px)}to{clip-path:inset(-20% -10% -20% -10%);opacity:1;filter:blur(0)}}
@keyframes shine{to{background-position:-250% 0}}
.tag{font-size:clamp(1.05rem,2.8vw,1.5rem);color:var(--silver);margin-top:.8rem;opacity:0;animation:fade .8s .9s forwards}
@keyframes fade{to{opacity:1}}
.btns{display:flex;gap:.9rem;flex-wrap:wrap;justify-content:center;margin-top:2rem;opacity:0;animation:fade .8s 1.2s forwards}
.b{padding:.8rem 2rem;border-radius:99px;font-weight:700;text-decoration:none;transition:transform .25s,box-shadow .25s}
.b1{background:var(--metal);color:var(--black);box-shadow:0 0 30px #d4a73a66}
.b2{border:2px solid var(--silver);color:var(--silver2)}
.b:hover{transform:translateY(-3px) scale(1.04)}
.b1:hover{box-shadow:0 0 50px #d4a73aaa}
.b2:hover{background:#ffffff1a}
a:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:4px}

/* المعرض: كل البطاقات بنفس الحجم والمسافات، والصف الأخير في المنتصف */
.work{padding:5rem 1.2rem;max-width:1180px;margin:auto}
h2{font-family:'Cairo',sans-serif;font-weight:700;font-size:clamp(1.8rem,5vw,2.6rem);text-align:center;color:var(--title)}
.bar{width:90px;height:4px;border-radius:4px;margin:.8rem auto 1rem;background:linear-gradient(90deg,var(--gold),var(--silver),var(--gold))}
.sub{text-align:center;color:var(--muted);margin-bottom:2.8rem}
.work .sec2{margin-top:6rem}
.grid{display:flex;flex-wrap:wrap;justify-content:center;gap:1.6rem}
.card{width:calc((100% - 3.2rem)/3);aspect-ratio:1;border-radius:22px;padding:3px;border:0;cursor:pointer;display:block;
  background:var(--cardbg);transition:transform .15s ease-out,box-shadow .3s,background .3s;box-shadow:0 8px 30px var(--shadow)}
.card:hover{background:linear-gradient(135deg,var(--gold),var(--silver),var(--gold2),var(--gold3));box-shadow:0 20px 50px #d4a73a55}
/* خلفية الشعار سوداء ليظهر الشعار الأبيض */
.inner{width:100%;height:100%;border-radius:19px;background:radial-gradient(circle at 50% 35%,#1b1c21,#000 75%);display:grid;place-items:center;overflow:hidden;position:relative}
.lightplate .inner{background:#fff}
.inner img{width:82%;height:82%;object-fit:contain;transition:transform .5s}
.card:hover img{transform:scale(1.07)}
.ph{color:var(--silver);font-size:1.1rem;direction:ltr}
.inner::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,#f6e3a155 50%,transparent 60%);transform:translateX(-120%);transition:transform .8s}
.card:hover .inner::after{transform:translateX(120%)}
.covers .card{width:calc((100% - 1.6rem)/2);aspect-ratio:16/10}
.covers .inner img{width:94%;height:94%}
@media (max-width:900px){.card{width:calc((100% - 1.6rem)/2)}}
@media (max-width:560px){.card,.covers .card{width:100%}}

/* حركة الظهور الفخمة: تخرج الشعارات من العتمة ثم يمر عليها شعاع ذهبي */
.reveal{opacity:0}
.reveal.in{opacity:1;animation:lux 1.8s cubic-bezier(.16,1,.3,1) var(--d,0s) backwards}
@keyframes lux{
  from{opacity:0;transform:translateY(60px) scale(.92);filter:blur(12px) brightness(.4)}
  to{opacity:1;transform:none;filter:none}
}
.reveal.in .inner::after{animation:sweep 1.8s calc(var(--d,0s) + 1.1s) ease-in-out}
@keyframes sweep{from{transform:translateX(-120%)}to{transform:translateX(120%)}}
.fx{opacity:0;transform:translateY(26px);transition:opacity .9s,transform .9s}
.fx.in{opacity:1;transform:none}

/* التواصل */
.contact{position:relative;text-align:center;color:#fff;padding:5rem 1.5rem;overflow:hidden;
  background:linear-gradient(135deg,#050506,#24252b)}
.contact h2{color:#fff}
.contact p{color:var(--silver);margin:.4rem 0 2rem}
.mail{display:inline-block;direction:ltr;font-size:clamp(1rem,3.5vw,1.3rem);padding:.9rem 2rem;border-radius:99px;text-decoration:none;font-weight:600;
  background:var(--metal);color:var(--black);box-shadow:0 0 40px #d4a73a55;transition:transform .25s,box-shadow .25s;animation:pulse 2.6s infinite}
.mail:hover{transform:scale(1.05)}
@keyframes pulse{50%{box-shadow:0 0 60px #d4a73aaa}}

footer{text-align:center;padding:2rem 1rem;color:var(--muted);font-size:.9rem;background:var(--foot);transition:background .4s}
footer b{font-family:'Cormorant Garamond',serif;font-size:1.4rem;color:var(--title);display:block;direction:ltr}

/* تكبير الشعار */
.lb{position:fixed;inset:0;z-index:30;background:#000000ee;display:none;place-items:center;padding:1.5rem;cursor:zoom-out}
.lb.on{display:grid}
.lb img{max-width:min(92vw,800px);max-height:85vh;background:radial-gradient(circle at 50% 35%,#1b1c21,#000 75%);border:2px solid var(--gold);border-radius:18px;padding:1rem;box-shadow:0 0 80px #d4a73a66}

/* لمن أوقف الحركة في ويندوز: نوقف الحركات المتكررة فقط، وتبقى حركة الظهور */
@media (prefers-reduced-motion:reduce){
  .orb,.hero,.mail{animation:none}
  .mark{animation:pop .1s both}
  .brand{animation:brandIn 1.3s .15s both}
}
</style>
</head>
<body>

<nav>
  <a class="lg" href="#top" aria-label="aalilou">
    <span id="navMark"><svg viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="96" fill="#0b0b0e" stroke="#d4a73a" stroke-width="5"/><polygon points="142,14 147,17 62,185 56,181" fill="#fff"/><text x="122" y="140" font-size="96" text-anchor="middle" fill="#fff" font-family="Cormorant Garamond,serif" font-weight="700">A</text></svg></span>
    aalilou
  </a>
  <div class="acts">
    <button class="tg" id="tg" type="button" aria-label="تبديل الوضع الليلي والنهاري" title="الوضع الليلي / النهاري">
      <svg class="moon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21 14.5A9 9 0 0 1 9.5 3a9 9 0 1 0 11.5 11.5z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>
    </button>
    <a class="cta" href="#contact">تواصل معي</a>
  </div>
</nav>

<header class="hero" id="top">
  <div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
  <div class="mark" id="heroMark"><svg viewBox="0 0 200 200" role="img" aria-label="شعار aalilou">
    <circle cx="100" cy="100" r="96" fill="#0b0b0e" stroke="#d4a73a" stroke-width="4"/>
    <line class="slash" x1="146" y1="16" x2="59" y2="183" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    <text x="122" y="140" font-size="96" text-anchor="middle" fill="#fff" font-family="Cormorant Garamond,serif" font-weight="700">A</text>
  </svg></div>
  <h1 class="brand" id="brand">Aalilou</h1>
  <p class="tag">شعارات تعبّر عن علامتك وتجذب عملاءك</p>
  <div class="btns">
    <a class="b b1" href="#work">شاهد أعمالي</a>
    <a class="b b2" href="#contact">اطلب شعارك</a>
  </div>
</header>

<section class="work" id="work">
  <h2 class="fx">الشعارات</h2>
  <div class="bar fx"></div>
  <p class="sub fx">اضغط على أي شعار لتكبيره</p>
  <div class="grid" id="grid"></div>

  <h2 class="fx sec2">الأغلفة</h2>
  <div class="bar fx"></div>
  <p class="sub fx">تصاميم أغلفة من أعمالي</p>
  <div class="grid covers" id="covers"></div>
</section>

<section class="contact" id="contact">
  <h2>هل تريد شعاراً لعلامتك؟</h2>
  <div class="bar"></div>
  <p>راسلني وصِف لي فكرتك، وأرد عليك في أقرب وقت</p>
  <a class="mail" href="mailto:yahyaalilou52@gmail.com?subject=طلب تصميم شعار">yahyaalilou52@gmail.com</a>
</section>

<footer>
  <b>Aalilou</b>
  جميع الحقوق محفوظة © <span id="y"></span>
</footer>

<div class="lb" id="lb"><img alt=""></div>

<script>
/* ===== أسماء ملفات شعاراتك (بدون الامتداد) =====
   الموقع يجرّب تلقائياً: svg ثم png ثم jpg ثم jpeg ثم webp
   ويرتّبها تلقائياً من A إلى Z، فأضف الجديد في أي مكان */
const LOGOS = [
  "A-logo",
  "love-logo",
  "calm-logo",
  "d-logo",
  "e-logo",
  "funny-logo",
  "geme-logo",
  "h-logo",
  "hors-logo",
  "N-LOGO",
  "star-logo"
];

/* ===== الأغلفة ===== */
const COVERS = [
  "my-work-desain",
  "thedark-desain",
];
const EXT = ["svg","png","jpg","jpeg","webp"];

/* شعارات سوداء تحتاج خلفية بيضاء (اتركها فارغة إن لم تحتج): مثال ["A-logo"] */
const LIGHT_BG = [];

/* ===== شعارك الرسمي (يظهر في الأعلى وفي الواجهة): اكتب اسم ملفه بدون الامتداد ===== */
const BRAND_LOGO = "A-logo";
(function(){
  const img=new Image();img.alt="شعار aalilou";let k=0;
  img.onload=()=>{
    document.getElementById("heroMark").replaceChildren(img);
    const n=new Image();n.src=img.src;n.alt="";
    document.getElementById("navMark").replaceChildren(n);
  };
  const next=()=>{if(k<EXT.length)img.src=encodeURI(BRAND_LOGO+"."+EXT[k++])};
  img.onerror=next;next();
})();

document.getElementById("y").textContent=new Date().getFullYear();

// زر الوضع الليلي
document.getElementById("tg").addEventListener("click",()=>{
  const t=document.documentElement.dataset.theme==="dark"?"light":"dark";
  document.documentElement.dataset.theme=t;
  try{localStorage.setItem("theme",t)}catch(e){}
});

// المعرض (مرتّب A-Z)
const lb=document.getElementById("lb"),lbImg=lb.querySelector("img");
function build(list,grid){
  [...list].sort((a,b)=>a.localeCompare(b,undefined,{sensitivity:"base",numeric:true})).forEach(name=>{
    const b=document.createElement("button");b.type="button";b.className="card reveal"+(LIGHT_BG.includes(name)?" lightplate":"");b.setAttribute("aria-label",name);
    const inner=document.createElement("div");inner.className="inner";
    const img=new Image();img.alt=name+" من تصميم aalilou";
    let k=0;
    const next=()=>{
      if(k>=EXT.length){img.remove();const p=document.createElement("div");p.className="ph";p.textContent=name;inner.prepend(p);b.dataset.empty=1;return}
      img.src=encodeURI(name+"."+EXT[k++]);
    };
    img.onerror=next;next();
    inner.appendChild(img);b.appendChild(inner);grid.appendChild(b);

    b.addEventListener("mousemove",e=>{const r=b.getBoundingClientRect();
      const x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
      b.style.transform=`perspective(800px) rotateY(${x*12}deg) rotateX(${-y*12}deg) scale(1.03)`});
    b.addEventListener("mouseleave",()=>b.style.transform="");
    b.addEventListener("click",()=>{if(b.dataset.empty)return;lbImg.src=img.src;lb.classList.add("on")});
  });
}
build(LOGOS,document.getElementById("grid"));
build(COVERS,document.getElementById("covers"));
lb.addEventListener("click",()=>lb.classList.remove("on"));
addEventListener("keydown",e=>{if(e.key==="Escape")lb.classList.remove("on")});

// ظهور العناصر عند التمرير
const items=document.querySelectorAll(".reveal,.fx");
if(!("IntersectionObserver" in window)){items.forEach(el=>el.classList.add("in"))}
else{
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.12});
  document.querySelectorAll(".grid").forEach(g=>[...g.children].forEach((el,i)=>el.style.setProperty("--d",(i%3)*.25+"s")));
  items.forEach(el=>io.observe(el));
}
</script>
</body>
</html>
